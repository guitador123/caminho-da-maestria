[pytest]
# testes automaticos ficam em tests/ (os scripts teste_*.py da raiz sao
# rodados pelo tests/test_integracao.py)
testpaths = tests
# por padrao so a logica pura (rapida, sem rede e sem janela);
# `python -m pytest -m integracao` roda os que usam Supabase/janela
addopts = -m "not integracao"
markers =
    integracao: precisa do Supabase (conta de teste) e/ou abre janelas
